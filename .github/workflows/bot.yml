name: Ayush Bot 24/7

on:
  workflow_dispatch:

  schedule:
    # Start a new bot session every 5 hours.
    # GitHub cron uses UTC.
    - cron: "0 */5 * * *"

permissions:
  contents: read

# Prevent accidental duplicate bot instances.
# Do NOT use cancel-in-progress here.
concurrency:
  group: ayush-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # GitHub-hosted runners have a maximum job runtime of 6 hours.
    # 330 minutes = 5 hours 30 minutes.
    timeout-minutes: 330

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # PYTHON
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt


      # =========================================
      # PIP
      # =========================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python --version
          python -m pip --version


      # =========================================
      # DEPENDENCIES
      # =========================================

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements.txt


      # =========================================
      # VERIFY DEPENDENCIES
      # =========================================

      - name: Verify installation
        run: |
          python -c "import telegram; print('python-telegram-bot:', telegram.__version__)"
          python -c "import google.genai; print('google-genai: OK')"
          python -c "import openai; print('openai: OK')"
          python -c "import flask; print('flask: OK')"
          python -c "import flask_cors; print('flask-cors: OK')"
          python -c "import requests; print('requests: OK')"
          python -c "import dotenv; print('python-dotenv: OK')"


      # =========================================
      # CHECK BOT FILE
      # =========================================

      - name: Check bot.py
        run: |
          test -f bot.py
          python -m py_compile bot.py
          echo "✅ bot.py syntax check passed"


      # =========================================
      # RUN BOT
      # =========================================

      - name: Run Ayush Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}

          PYTHONUNBUFFERED: "1"

        run: |
          echo "=========================================="
          echo "🤖 Starting Ayush Bot"
          echo "=========================================="
          echo "Python:"
          python --version
          echo ""
          echo "Starting bot.py..."
          echo ""

          python -u bot.py

      # =========================================
      # FAILURE INFORMATION
      # =========================================

      - name: Bot stopped
        if: always()
        run: |
          echo "=========================================="
          echo "⚠️ Ayush Bot process has stopped."
          echo "=========================================="
          echo "Check the logs above for the reason."
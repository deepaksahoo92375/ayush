name: Ayush Bot 24/7

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

# Prevent multiple Ayush bot instances from running at the same time.
concurrency:
  group: ayush-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Ayush Bot
    runs-on: ubuntu-latest

    # GitHub-hosted runners have a maximum job runtime of 6 hours.
    timeout-minutes: 330

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Verify bot.py
      # --------------------------------------------------
      - name: Verify bot.py
        run: |
          echo "=========================================="
          echo "CHECKING AYUSH BOT"
          echo "=========================================="

          if [ ! -f bot.py ]; then
            echo "❌ bot.py not found"
            exit 1
          fi

          echo "✅ bot.py found"

          echo ""
          echo "Bot.py line count:"
          wc -l bot.py

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Last 40 lines of bot.py:"
          tail -n 40 bot.py

          echo ""
          echo "Running syntax check..."

          python -m py_compile bot.py

          echo ""
          echo "✅ bot.py syntax is valid."

      # --------------------------------------------------
      # 5. Verify secrets
      # --------------------------------------------------
      - name: Verify required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEVELOPER_GROUP_ID: ${{ secrets.DEVELOPER_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          echo "=========================================="
          echo "CHECKING SECRETS"
          echo "=========================================="

          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ BOT_TOKEN is missing"
            exit 1
          else
            echo "✅ BOT_TOKEN is present"
          fi

          if [ -z "$DEVELOPER_GROUP_ID" ]; then
            echo "❌ DEVELOPER_GROUP_ID is missing"
            exit 1
          else
            echo "✅ DEVELOPER_GROUP_ID is present"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY is missing"
          else
            echo "✅ GEMINI_API_KEY is present"
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY is missing"
          else
            echo "✅ OPENAI_API_KEY is present"
          fi

          if [ -z "$OWNER_ID" ]; then
            echo "⚠️ OWNER_ID is missing"
          else
            echo "✅ OWNER_ID is present"
          fi

      # --------------------------------------------------
      # 6. Run Ayush Bot
      # --------------------------------------------------
      - name: Run Ayush Bot
        env:
          # Telegram
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          # Developer monitoring
          DEVELOPER_GROUP_ID: ${{ secrets.DEVELOPER_GROUP_ID }}

          # AI providers
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Storage / statistics
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          # Owner / admin
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}

          # Python
          PYTHONUNBUFFERED: "1"

        run: |
          echo "=========================================="
          echo "🤖 AYUSH BOT STARTING"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Launching bot.py..."
          echo ""

          python -u bot.py

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "BOT EXITED"
          echo "Exit code: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE

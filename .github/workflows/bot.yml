name: Ayush Bot 24/7

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: ayush-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Ayush Bot
    runs-on: ubuntu-latest

    # GitHub-hosted runners have a maximum job duration.
    # 330 minutes gives the bot enough time before the next scheduled run.
    timeout-minutes: 330

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # =====================================================
      # VERIFY BOT FILE
      # =====================================================
      - name: Verify bot.py
        run: |
          echo "=========================================="
          echo "CHECKING AYUSH BOT"
          echo "=========================================="

          if [ ! -f bot.py ]; then
            echo "❌ bot.py not found"
            exit 1
          fi

          echo "✅ bot.py found"

          echo ""
          echo "Bot.py line count:"
          wc -l bot.py

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Last 40 lines of bot.py:"
          tail -n 40 bot.py

          echo ""
          echo "Running syntax check..."

          python -m py_compile bot.py

          echo ""
          echo "✅ bot.py syntax is valid."

      # =====================================================
      # VERIFY REQUIRED SECRETS
      # =====================================================
      - name: Verify required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEVELOPER_GROUP_ID: ${{ secrets.DEVELOPER_GROUP_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}

        run: |
          echo "=========================================="
          echo "CHECKING AYUSH BOT SECRETS"
          echo "=========================================="

          # -------------------------------------------------
          # TELEGRAM BOT
          # -------------------------------------------------
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ BOT_TOKEN is missing"
            exit 1
          else
            echo "✅ BOT_TOKEN is present"
          fi

          # -------------------------------------------------
          # DEVELOPER GROUP
          # -------------------------------------------------
          if [ -z "$DEVELOPER_GROUP_ID" ]; then
            echo "❌ DEVELOPER_GROUP_ID is missing"
            exit 1
          else
            echo "✅ DEVELOPER_GROUP_ID is present"
          fi

          # -------------------------------------------------
          # AI PROVIDERS
          # -------------------------------------------------
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY is missing"
          else
            echo "✅ GEMINI_API_KEY is present"
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY is missing"
          else
            echo "✅ OPENAI_API_KEY is present"
          fi

          if [ -z "$GROQ_API_KEY" ]; then
            echo "⚠️ GROQ_API_KEY is missing"
          else
            echo "✅ GROQ_API_KEY is present"
          fi

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "⚠️ OPENROUTER_API_KEY is missing"
          else
            echo "✅ OPENROUTER_API_KEY is present"
          fi

          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "⚠️ CEREBRAS_API_KEY is missing"
          else
            echo "✅ CEREBRAS_API_KEY is present"
          fi

          # -------------------------------------------------
          # GITHUB GIST
          # -------------------------------------------------
          if [ -z "$GIST_ID" ]; then
            echo "⚠️ GIST_ID is missing"
          else
            echo "✅ GIST_ID is present"
          fi

          if [ -z "$GIST_TOKEN" ]; then
            echo "⚠️ GIST_TOKEN is missing"
          else
            echo "✅ GIST_TOKEN is present"
          fi

          # -------------------------------------------------
          # OWNER
          # -------------------------------------------------
          if [ -z "$OWNER_ID" ]; then
            echo "⚠️ OWNER_ID is missing"
          else
            echo "✅ OWNER_ID is present"
          fi

          # -------------------------------------------------
          # SUDO USERS
          # -------------------------------------------------
          if [ -z "$SUDO_USERS" ]; then
            echo "⚠️ SUDO_USERS is missing"
          else
            echo "✅ SUDO_USERS is present"
          fi

          echo ""
          echo "=========================================="
          echo "SECRET CHECK COMPLETE"
          echo "=========================================="

      # =====================================================
      # RUN AYUSH BOT
      # =====================================================
      - name: Run Ayush Bot
        env:
          # -------------------------------------------------
          # TELEGRAM
          # -------------------------------------------------
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEVELOPER_GROUP_ID: ${{ secrets.DEVELOPER_GROUP_ID }}

          # -------------------------------------------------
          # AI PROVIDERS
          # -------------------------------------------------
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          # -------------------------------------------------
          # GITHUB GIST
          # -------------------------------------------------
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          # -------------------------------------------------
          # OWNER / SUDO
          # -------------------------------------------------
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}

          # -------------------------------------------------
          # OPTIONAL GIST FILENAME
          # -------------------------------------------------
          GIST_FILENAME: "ayush_stats.json"

          # -------------------------------------------------
          # OPTIONAL AI MODELS
          # These can also be changed later through secrets
          # if your bot.py supports them.
          # -------------------------------------------------
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}

          # -------------------------------------------------
          # PYTHON
          # -------------------------------------------------
          PYTHONUNBUFFERED: "1"

        run: |
          echo "=========================================="
          echo "🤖 AYUSH BOT STARTING"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Launching bot.py..."
          echo ""

          python -u bot.py

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "BOT EXITED"
          echo "Exit code: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE

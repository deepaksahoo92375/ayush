```yaml
name: Ayush Bot 24/7

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: ayush-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 330

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python file
        run: |
          echo "=========================================="
          echo "Checking bot.py"
          echo "=========================================="

          test -f bot.py

          echo "bot.py line count:"
          wc -l bot.py

          echo ""
          echo "Last 40 lines of bot.py:"
          tail -n 40 bot.py

          echo ""
          echo "Running Python syntax check..."

          python -m py_compile bot.py

          echo ""
          echo "✅ bot.py syntax is valid."

      - name: Verify required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=========================================="
          echo "Checking required secrets"
          echo "=========================================="

          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ BOT_TOKEN is missing"
            exit 1
          else
            echo "✅ BOT_TOKEN is present"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY is missing"
          else
            echo "✅ GEMINI_API_KEY is present"
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY is missing"
          else
            echo "✅ OPENAI_API_KEY is present"
          fi

      - name: Run Ayush Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}
          PYTHONUNBUFFERED: "1"

        run: |
          echo "=========================================="
          echo "🤖 AYUSH BOT STARTING"
          echo "=========================================="

          python --version

          echo ""
          echo "Launching bot.py..."
          echo ""

          python -u bot.py

          EXIT_CODE=$?

          echo ""
          echo "Bot exited with code: $EXIT_CODE"

          exit $EXIT_CODE
```

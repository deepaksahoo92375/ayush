name: Ayush Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayush-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Run Ayush Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
      TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}

      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      GIST_FILENAME: "ayush_stats.json"
      ACCESS_FILENAME: "ayush_access.json"

      COOKIE_SECURE: "true"
      PYTHONUNBUFFERED: "1"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard/requirements.txt


      # ==========================================================
      # VERIFY FILES
      # ==========================================================

      - name: Verify dashboard files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING DASHBOARD FILES"
          echo "=========================================="

          test -f dashboard/dashboard.py
          test -f dashboard/requirements.txt
          test -f dashboard/templates/index.html
          test -f dashboard/templates/admin.html
          test -f dashboard/static/site.css

          echo "All dashboard files found."


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================================
      # PYTHON SYNTAX CHECK
      # ==========================================================

      - name: Check dashboard syntax
        run: |
          set -e

          python -m py_compile dashboard/dashboard.py

          echo "Dashboard syntax check passed."


      # ==========================================================
      # CHECK REQUIRED SECRETS
      # ==========================================================

      - name: Check required secrets
        shell: bash
        run: |
          set -e

          missing=0

          check_secret() {
            local name="$1"

            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          }

          check_secret BOT_TOKEN
          check_secret OWNER_ID
          check_secret GIST_ID
          check_secret GIST_TOKEN

          check_secret TELEGRAM_CLIENT_ID
          check_secret TELEGRAM_CLIENT_SECRET

          check_secret SESSION_SECRET
          check_secret TAILSCALE_AUTHKEY

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Required GitHub secrets are missing."
            exit 1
          fi

          echo ""
          echo "All required secrets are present."


      # ==========================================================
      # CONNECT TO TAILSCALE
      # ==========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      # ==========================================================
      # TAILSCALE STATUS
      # ==========================================================

      - name: Show Tailscale status
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TAILSCALE STATUS"
          echo "=========================================="

          sudo tailscale status

          echo ""
          echo "=========================================="
          echo "TAILSCALE HOSTNAME"
          echo "=========================================="

          TAILSCALE_DNS_NAME="$(sudo tailscale status --json | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          self_node = data.get("Self", {})
          print(self_node.get("DNSName", ""))
          ')"

          if [ -z "$TAILSCALE_DNS_NAME" ]; then
            echo "::error::Could not determine Tailscale DNS hostname."
            exit 1
          fi

          TAILSCALE_DNS_NAME="${TAILSCALE_DNS_NAME%.}"

          echo "Tailscale hostname:"
          echo "$TAILSCALE_DNS_NAME"

          echo ""
          echo "Public dashboard will use:"
          echo "https://$TAILSCALE_DNS_NAME"


      # ==========================================================
      # START DASHBOARD
      # ==========================================================

      - name: Start dashboard
        working-directory: dashboard
        run: |
          set -e

          echo "=========================================="
          echo "STARTING AYUSH DASHBOARD"
          echo "=========================================="

          nohup python -u -m uvicorn dashboard:app \
            --host 0.0.0.0 \
            --port 8000 \
            > ../dashboard.log 2>&1 &

          echo $! > ../dashboard.pid

          echo "Dashboard PID:"
          cat ../dashboard.pid


      # ==========================================================
      # WAIT FOR DASHBOARD
      # ==========================================================

      - name: Wait for dashboard
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "WAITING FOR FASTAPI"
          echo "=========================================="

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/ \
              > /dev/null
            then
              echo "Dashboard is ready."
              exit 0
            fi

            sleep 2

          done

          echo "::error::Dashboard failed to start."

          echo ""
          echo "===== DASHBOARD LOG ====="

          cat dashboard.log || true

          exit 1


      # ==========================================================
      # ENABLE TAILSCALE FUNNEL
      # ==========================================================

      - name: Start Tailscale Funnel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING TAILSCALE FUNNEL"
          echo "=========================================="

          echo ""
          echo "If Funnel has not yet been enabled for"
          echo "your tailnet, Tailscale will provide the"
          echo "authorization URL below."
          echo ""

          sudo tailscale funnel --bg 8000

          sleep 5

          echo ""
          echo "=========================================="
          echo "FUNNEL STATUS"
          echo "=========================================="

          sudo tailscale funnel status


      # ==========================================================
      # GET PUBLIC URL
      # ==========================================================

      - name: Show public dashboard URLs
        shell: bash
        run: |
          set -e

          TAILSCALE_DNS_NAME="$(sudo tailscale status --json | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          self_node = data.get("Self", {})
          print(self_node.get("DNSName", ""))
          ')"

          TAILSCALE_DNS_NAME="${TAILSCALE_DNS_NAME%.}"

          if [ -z "$TAILSCALE_DNS_NAME" ]; then
            echo "::error::Could not determine public hostname."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "AYUSH DASHBOARD PUBLIC URL"
          echo "=========================================="

          echo ""
          echo "Dashboard:"
          echo "https://$TAILSCALE_DNS_NAME"

          echo ""
          echo "Admin Login:"
          echo "https://$TAILSCALE_DNS_NAME/login"

          echo ""
          echo "Telegram OIDC Callback:"
          echo "https://$TAILSCALE_DNS_NAME/auth/callback"

          echo ""
          echo "Wallpaper API:"
          echo "https://$TAILSCALE_DNS_NAME/api/wallpaper"

          echo ""
          echo "Dashboard API:"
          echo "https://$TAILSCALE_DNS_NAME/api/dashboard"

          echo ""
          echo "=========================================="
          echo "TAILSCALE FUNNEL STATUS"
          echo "=========================================="

          sudo tailscale funnel status


      # ==========================================================
      # TEST PUBLIC DASHBOARD
      # ==========================================================

      - name: Test public dashboard
        shell: bash
        run: |
          set -e

          TAILSCALE_DNS_NAME="$(sudo tailscale status --json | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          self_node = data.get("Self", {})
          print(self_node.get("DNSName", ""))
          ')"

          TAILSCALE_DNS_NAME="${TAILSCALE_DNS_NAME%.}"

          echo "Testing:"
          echo "https://$TAILSCALE_DNS_NAME"

          sleep 5

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 20 \
            "https://$TAILSCALE_DNS_NAME/")"

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Public dashboard returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Public dashboard is reachable."


      # ==========================================================
      # KEEP DASHBOARD ALIVE
      # ==========================================================

      - name: Keep dashboard alive
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "AYUSH DASHBOARD IS LIVE"
          echo "=========================================="

          echo ""
          echo "The dashboard will remain available"
          echo "while this GitHub Actions job is running."

          echo ""
          echo "Press Stop/Cancel to terminate it."

          while true; do

            echo ""
            echo "----- $(date -u '+%Y-%m-%d %H:%M:%S UTC') -----"

            if [ -f dashboard.log ]; then
              tail -n 30 dashboard.log
            fi

            sleep 30

          done


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "CLEANUP"
          echo "=========================================="

          echo "Stopping Tailscale Funnel..."

          sudo tailscale funnel reset || true

          if [ -f dashboard.pid ]; then
            echo "Stopping dashboard..."

            kill "$(cat dashboard.pid)" 2>/dev/null || true
          fi

          echo "Cleanup completed."

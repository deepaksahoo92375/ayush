name: Ayush Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayush-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Run Ayush Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
      TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}

      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      GIST_FILENAME: "ayush_stats.json"
      ACCESS_FILENAME: "ayush_access.json"

      COOKIE_SECURE: "true"

      PYTHONUNBUFFERED: "1"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard/requirements.txt


      # ==========================================================
      # VERIFY FILES
      # ==========================================================

      - name: Verify dashboard files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING DASHBOARD FILES"
          echo "=========================================="

          test -f dashboard/dashboard.py
          test -f dashboard/requirements.txt
          test -f dashboard/templates/index.html
          test -f dashboard/templates/admin.html
          test -f dashboard/static/site.css

          echo "All dashboard files found."


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================================
      # PYTHON SYNTAX CHECK
      # ==========================================================

      - name: Check dashboard syntax
        run: |
          python -m py_compile dashboard/dashboard.py

          echo "Dashboard syntax check passed."


      # ==========================================================
      # CHECK REQUIRED SECRETS
      # ==========================================================

      - name: Check required secrets
        shell: bash
        run: |
          set -e

          missing=0

          check_secret() {
            local name="$1"

            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          }

          check_secret BOT_TOKEN
          check_secret OWNER_ID
          check_secret GIST_ID
          check_secret GIST_TOKEN
          check_secret TELEGRAM_CLIENT_ID
          check_secret TELEGRAM_CLIENT_SECRET
          check_secret SESSION_SECRET

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # TAILSCALE
      # ==========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      # ==========================================================
      # SHOW TAILSCALE DEVICE
      # ==========================================================

      - name: Show Tailscale status
        run: |
          echo "=========================================="
          echo "TAILSCALE STATUS"
          echo "=========================================="

          tailscale status

          echo ""
          echo "Machine hostname:"
          tailscale status --json | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          self_node = data.get("Self", {})

          print(self_node.get("DNSName", "unknown"))
          '


      # ==========================================================
      # START DASHBOARD
      # ==========================================================

      - name: Start dashboard
        working-directory: dashboard
        run: |
          set -e

          echo "Starting Ayush Dashboard..."

          nohup python -u -m uvicorn dashboard:app \
            --host 0.0.0.0 \
            --port 8000 \
            > ../dashboard.log 2>&1 &

          echo $! > ../dashboard.pid

          echo "Dashboard PID:"
          cat ../dashboard.pid


      # ==========================================================
      # WAIT FOR DASHBOARD
      # ==========================================================

      - name: Wait for dashboard
        shell: bash
        run: |
          set -e

          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/ \
              > /dev/null
            then
              echo "Dashboard is ready."
              exit 0
            fi

            sleep 2

          done

          echo "Dashboard failed to start."

          echo "===== DASHBOARD LOG ====="
          cat dashboard.log || true

          exit 1


      # ==========================================================
      # START TAILSCALE FUNNEL
      # ==========================================================

      - name: Start Tailscale Funnel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING TAILSCALE FUNNEL"
          echo "=========================================="

          tailscale funnel --bg 8000

          sleep 5

          echo ""
          echo "=========================================="
          echo "FUNNEL STATUS"
          echo "=========================================="

          tailscale funnel status


      # ==========================================================
      # GET PUBLIC URL
      # ==========================================================

      - name: Get public dashboard URL
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "AYUSH DASHBOARD PUBLIC URL"
          echo "=========================================="

          tailscale funnel status

          echo ""
          echo "Look for the HTTPS URL shown above."
          echo ""
          echo "Admin URL:"
          echo "https://YOUR-TAILSCALE-HOSTNAME.ts.net/login"
          echo ""
          echo "OIDC callback:"
          echo "https://YOUR-TAILSCALE-HOSTNAME.ts.net/auth/callback"


      # ==========================================================
      # KEEP DASHBOARD ALIVE
      # ==========================================================

      - name: Keep dashboard alive
        shell: bash
        run: |
          echo "=========================================="
          echo "AYUSH DASHBOARD IS LIVE"
          echo "=========================================="

          echo "The dashboard will remain available"
          echo "while this GitHub Actions job is running."

          echo ""
          echo "Press Stop/Cancel to terminate it."

          while true; do

            if [ -f dashboard.log ]; then
              echo ""
              echo "----- $(date -u '+%Y-%m-%d %H:%M:%S UTC') -----"
              tail -n 30 dashboard.log
            fi

            sleep 30

          done


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Funnel..."

          tailscale funnel reset || true

          if [ -f dashboard.pid ]; then
            kill "$(cat dashboard.pid)" 2>/dev/null || true
          fi
